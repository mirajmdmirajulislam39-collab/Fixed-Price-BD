<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed Price BD Admin</title>
<style>
body{margin:0;background:#f4f7fb;color:#182334;font-family:system-ui,"Noto Sans Bengali",sans-serif}
.wrap{max-width:720px;margin:24px auto;padding:16px}
.card{background:white;border:1px solid #e0e6ee;border-radius:16px;padding:18px;margin:14px 0}
h1{font-size:25px}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,textarea{width:100%;padding:12px;border:1px solid #cdd5df;border-radius:10px;font:inherit;box-sizing:border-box}
button{border:0;border-radius:10px;padding:12px 15px;background:#0f766e;color:white;font-weight:bold;font:inherit;cursor:pointer;margin-top:12px}
.secondary{background:#64748b}
.danger{background:#b42318}
.muted{color:#64748b;font-size:14px}
.status{padding:10px;border-radius:10px;background:#fef3c7;color:#854d0e;white-space:pre-wrap;overflow-wrap:anywhere}
.item{padding:12px 0;border-bottom:1px solid #e5e7eb}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="wrap">
<h1>FIXED PRICE BD — Admin Panel</h1>
<div class="muted">অ্যাডমিন লগইন করে পণ্য পরিচালনা করুন।</div>
<div id="status" class="status">Firebase চালু হচ্ছে…</div>

<section class="card" id="login">
<h2>🔐 অ্যাডমিন লগইন</h2>
<label for="email">ইমেইল</label>
<input id="email" type="email" autocomplete="username" placeholder="অ্যাডমিন ইমেইল">
<label for="password">পাসওয়ার্ড</label>
<input id="password" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড">
<button id="signIn" type="button">লগইন করুন</button>
</section>

<section class="card hidden" id="panel">
<h2>📦 পণ্য পরিচালনা</h2>
<button class="secondary" id="signOut" type="button">লগআউট</button>

<form id="form">
<label for="name">পণ্যের নাম</label>
<input id="name" required>
<label for="price">বিক্রয় মূল্য (টাকা)</label>
<input id="price" type="number" min="0" required>
<label for="oldPrice">আগের মূল্য (টাকা)</label>
<input id="oldPrice" type="number" min="0">
<label for="image">ছবির সরাসরি URL (ঐচ্ছিক)</label>
<input id="image" type="url" placeholder="https://...">
<label for="desc">ছোট বিবরণ</label>
<textarea id="desc" rows="3"></textarea>
<button id="saveProduct" type="submit">পণ্য সংরক্ষণ করুন</button>
</form>

<h2>সংরক্ষিত পণ্য</h2>
<div id="list">লগইন করুন।</div>
</section>

<div class="card muted">
Firebase Authentication ও Firestore Rules নিরাপদ রাখুন। সবার জন্য পণ্য যোগ বা মুছে ফেলার অনুমতি দেবেন না।
</div>
</main>

<script type="module">
import {initializeApp}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,
 signOut,setPersistence,inMemoryPersistence
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

import {
 getFirestore,collection,addDoc,getDocs,deleteDoc,doc,serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
 apiKey:'AIzaSyA51VwuUTSCZAscEWhyyzhBJw4tntqHsMQ',
 authDomain:'fixed-price-bd.firebaseapp.com',
 projectId:'fixed-price-bd',
 storageBucket:'fixed-price-bd.firebasestorage.app',
 messagingSenderId:'1055121018003',
 appId:'1:1055121018003:web:f1bcebcb16376fa8bb9166',
 measurementId:'G-BWZF99N2TV'
};

const $=id=>document.getElementById(id);
let auth,db,ready=false,loading=false;

function status(message){
 $('status').textContent=message;
}

function errorMessage(prefix,error){
 status(prefix+': '+(error.code||'')+' — '+error.message);
}

async function start(){
 try{
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  db=getFirestore(app);

  // লগইন কেবল বর্তমান পেজের মেমোরিতে থাকবে।
  await setPersistence(auth,inMemoryPersistence);

  // প্রতিবার নতুন করে পেজ খুললে আগের লগইন বন্ধ হবে।
  await signOut(auth);

  ready=true;
  status('প্রস্তুত। আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।');

  onAuthStateChanged(auth,user=>{
   $('login').classList.toggle('hidden',!!user);
   $('panel').classList.toggle('hidden',!user);

   if(user){
    status('লগইন করা আছে: '+user.email);
    loadProducts();
   }else{
    $('list').textContent='লগইন করলে পণ্য দেখা যাবে।';
   }
  });
 }catch(error){
  errorMessage('Firebase চালু করতে সমস্যা',error);
 }
}

$('signIn').onclick=async()=>{
 if(!ready){
  status('Firebase চালু হওয়া পর্যন্ত অপেক্ষা করুন।');
  return;
 }
 const email=$('email').value.trim();
 const password=$('password').value;

 if(!email||!password){
  status('ইমেইল ও পাসওয়ার্ড লিখুন।');
  return;
 }

 $('signIn').disabled=true;
 try{
  await signInWithEmailAndPassword(auth,email,password);
  status('লগইন সফল হয়েছে।');
 }catch(error){
  errorMessage('লগইন ব্যর্থ',error);
 }finally{
  $('signIn').disabled=false;
 }
};

$('signOut').onclick=async()=>{
 try{
  await signOut(auth);
  $('password').value='';
  status('লগআউট হয়েছে।');
 }catch(error){
  errorMessage('লগআউট ব্যর্থ',error);
 }
};

$('form').onsubmit=async event=>{
 event.preventDefault();

 if(!auth?.currentUser){
  status('আগে অ্যাডমিন লগইন করুন।');
  return;
 }

 const name=$('name').value.trim();
 const price=Number($('price').value);
 const oldPrice=Number($('oldPrice').value||0);
 const image=$('image').value.trim();
 const desc=$('desc').value.trim();

 if(!name||!Number.isFinite(price)||price<0||
    !Number.isFinite(oldPrice)||oldPrice<0){
  status('পণ্যের নাম ও সঠিক মূল্য লিখুন।');
  return;
 }

 $('saveProduct').disabled=true;
 try{
  await addDoc(collection(db,'products'),{
   name,price,oldPrice,image,desc,
   createdAt:serverTimestamp()
  });
  event.target.reset();
  status('পণ্য সংরক্ষণ হয়েছে।');
  await loadProducts();
 }catch(error){
  errorMessage('পণ্য সংরক্ষণ ব্যর্থ',error);
 }finally{
  $('saveProduct').disabled=false;
 }
};

async function loadProducts(){
 if(loading||!auth?.currentUser)return;
 loading=true;
 $('list').textContent='পণ্য লোড হচ্ছে…';

 try{
  const snapshot=await getDocs(collection(db,'products'));
  $('list').replaceChildren();

  if(snapshot.empty){
   $('list').textContent='এখনও কোনো পণ্য নেই।';
   return;
  }

  snapshot.forEach(product=>{
   const data=product.data();
   const item=document.createElement('div');
   item.className='item';

   const title=document.createElement('b');
   title.textContent=data.name||'(নাম নেই)';

   const detail=document.createElement('div');
   detail.textContent='বিক্রয় মূল্য: ৳'+(data.price??0)+
    ' | আগের মূল্য: ৳'+(data.oldPrice??0);

   item.append(title,detail);

   if(data.desc){
    const description=document.createElement('p');
    description.textContent=data.desc;
    item.append(description);
   }

   if(data.image){
    const picture=document.createElement('img');
    picture.src=data.image;
    picture.alt=data.name||'পণ্যের ছবি';
    picture.style.maxWidth='120px';
    picture.style.display='block';
    picture.onerror=()=>picture.remove();
    item.append(picture);
   }

   const button=document.createElement('button');
   button.className='danger';
   button.textContent='মুছুন';

   button.onclick=async()=>{
    if(!auth.currentUser){
     status('আবার লগইন করুন।');
     return;
    }
    if(!confirm('এই পণ্যটি মুছে ফেলবেন?'))return;

    button.disabled=true;
    try{
     await deleteDoc(doc(db,'products',product.id));
     status('পণ্য মুছে ফেলা হয়েছে।');
     await loadProductsAfterDelete();
    }catch(error){
     errorMessage('পণ্য মুছতে সমস্যা',error);
     button.disabled=false;
    }
   };

   item.append(button);
   $('list').append(item);
  });
 }catch(error){
  errorMessage('পণ্য লোড ব্যর্থ। Firestore Rules পরীক্ষা করুন',error);
 }finally{
  loading=false;
 }
}

async function loadProductsAfterDelete(){
 await loadProducts();
}

start();
</script>
</body>
</html>
