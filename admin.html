<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed Price BD Admin</title>
<style>
body{margin:0;background:#f4f7fb;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#182334}.wrap{max-width:720px;margin:20px auto;padding:14px}.card{background:white;border:1px solid #e0e6ee;border-radius:14px;padding:16px;margin:14px 0}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cdd5df;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 14px;background:#0f766e;color:white;font:inherit;font-weight:bold;margin-top:12px}.secondary{background:#64748b}.danger{background:#b42318}.status{padding:10px;background:#fef3c7;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none!important}.item{border-bottom:1px solid #ddd;padding:12px 0}img.preview{max-width:160px;max-height:160px;display:block;margin-top:10px;object-fit:contain}
</style></head><body><main class="wrap"><h1>FIXED PRICE BD — Admin</h1><p id="status" class="status">Firebase চালু হচ্ছে…</p>
<section id="login" class="card"><h2>অ্যাডমিন লগইন</h2><label>ইমেইল</label><input id="email" type="email" autocomplete="username"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">লগইন করুন</button></section>
<section id="panel" class="card hidden"><button id="signOut" class="secondary">লগআউট</button><h2>পণ্য যোগ করুন</h2>
<form id="form"><label>পণ্যের নাম</label><input id="name" required><label>বিক্রয় মূল্য (টাকা)</label><input id="price" type="number" min="0" required><label>আগের মূল্য (টাকা)</label><input id="oldPrice" type="number" min="0"><label>ছবি ফাইল বেছে নিন</label><input id="photoFile" type="file" accept="image/*"><img id="preview" class="preview hidden" alt="ছবির প্রিভিউ"><p>অথবা</p><label>ছবির সরাসরি URL (ঐচ্ছিক)</label><input id="image" type="url" placeholder="https://..."><label>ছোট বিবরণ</label><textarea id="desc" rows="3"></textarea><button id="save" type="submit">পণ্য সংরক্ষণ করুন</button></form><h2>সংরক্ষিত পণ্য</h2><div id="list">লগইন করুন।</div></section>
<p>ছবি ছোট আকারে সংরক্ষণ করা হয়। Firestore-এর ১ MiB ডকুমেন্ট সীমা আছে; বড় ছবি সংরক্ষণ করা যাবে না।</p></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,inMemoryPersistence}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const config={apiKey:'AIzaSyA51VwuUTSCZAscEWhyyzhBJw4tntqHsMQ',authDomain:'fixed-price-bd.firebaseapp.com',projectId:'fixed-price-bd',storageBucket:'fixed-price-bd.firebasestorage.app',messagingSenderId:'1055121018003',appId:'1:1055121018003:web:f1bcebcb16376fa8bb9166',measurementId:'G-BWZF99N2TV'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let selectedImage="";
const say=t=>$("status").textContent=t;const fail=(t,e)=>say(t+": "+(e.code||"")+" — "+e.message);
await setPersistence(auth,inMemoryPersistence);
onAuthStateChanged(auth,u=>{$("login").classList.toggle("hidden",!!u);$("panel").classList.toggle("hidden",!u);if(u){say("লগইন করা আছে: "+u.email);load()}else $("list").textContent="লগইন করলে পণ্য দেখা যাবে।"});
$("signIn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){fail("লগইন ব্যর্থ",e)}};
$("signOut").onclick=()=>signOut(auth);
$("photoFile").onchange=async()=>{selectedImage="";$("preview").classList.add("hidden");let file=$("photoFile").files[0];if(!file)return;if(!file.type.startsWith("image/")){say("ছবির ফাইল নির্বাচন করুন।");return}try{selectedImage=await compress(file);$("preview").src=selectedImage;$("preview").classList.remove("hidden");say("ছবি প্রস্তুত। এখন পণ্য সংরক্ষণ করুন।")}catch(e){say("ছবি প্রস্তুত করা যায়নি: "+e.message)}};
function compress(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);let scale=Math.min(1,700/Math.max(img.width,img.height));let c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);let data=c.toDataURL("image/jpeg",.55);if(data.length>700000)reject(new Error("ছবিটি এখনও বড়। আরও ছোট ছবি বেছে নিন।"));else resolve(data)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("ছবি খোলা যায়নি"))};img.src=url})}
$("form").onsubmit=async e=>{e.preventDefault();if(!auth.currentUser){say("আগে লগইন করুন।");return}let image=selectedImage||$("image").value.trim();let name=$("name").value.trim(),price=Number($("price").value),oldPrice=Number($("oldPrice").value||0),desc=$("desc").value.trim();if(!name||!Number.isFinite(price)||price<0){say("নাম ও সঠিক দাম লিখুন।");return}if(image.startsWith("data:image/")&&image.length>700000){say("ছবিটি বড়। ছোট ছবি ব্যবহার করুন।");return}$("save").disabled=true;try{await addDoc(collection(db,"products"),{name,price,oldPrice,image,desc,createdAt:serverTimestamp()});e.target.reset();selectedImage="";$("preview").classList.add("hidden");say("পণ্য সংরক্ষণ হয়েছে।");await load()}catch(err){fail("সংরক্ষণ ব্যর্থ। Firestore Rules ও ছবির আকার পরীক্ষা করুন",err)}finally{$("save").disabled=false}};
async function load(){try{let s=await getDocs(collection(db,"products"));$("list").replaceChildren();if(s.empty){$("list").textContent="এখনও কোনো পণ্য নেই।";return}s.forEach(d=>{let p=d.data(),div=document.createElement("div");div.className="item";let b=document.createElement("b");b.textContent=p.name||"(নাম নেই)";let line=document.createElement("div");line.textContent="বিক্রয় মূল্য: ৳"+(p.price||0);div.append(b,line);if(p.image){let im=document.createElement("img");im.className="preview";im.src=p.image;im.alt=p.name||"পণ্যের ছবি";div.append(im)}let del=document.createElement("button");del.className="danger";del.textContent="মুছুন";del.onclick=async()=>{if(confirm("পণ্যটি মুছবেন?"))try{await deleteDoc(doc(db,"products",d.id));await load()}catch(e){fail("মুছতে সমস্যা",e)}};div.append(del);$("list").append(div)})}catch(e){fail("পণ্য লোড ব্যর্থ। Firestore Rules পরীক্ষা করুন",e)}}
</script></body></html>
