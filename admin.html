
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixed Price BD Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#182334}
.wrap{max-width:760px;margin:20px auto;padding:14px}
.card{background:white;border:1px solid #e0e6ee;border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,textarea{width:100%;padding:11px;border:1px solid #cdd5df;border-radius:9px;font:inherit}
button{border:0;border-radius:9px;padding:11px 14px;background:#0f766e;color:white;font:inherit;font-weight:bold;margin:6px 5px 0 0}
.secondary{background:#64748b}
.danger{background:#b42318}
.status{padding:10px;background:#fef3c7;border-radius:8px;overflow-wrap:anywhere}
.hidden{display:none!important}
.item{border:1px solid #e0e6ee;border-radius:12px;padding:12px;margin:12px 0;background:#fff}
.item img{max-width:160px;max-height:160px;display:block;margin-top:10px;object-fit:contain}
.item-actions{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:13px;color:#596b63;line-height:1.6}
</style>
</head>
<body>
<main class="wrap">
<h1>🛍️ FIXED PRICE BD — Admin</h1>
<p id="status" class="status">Firebase চালু হচ্ছে…</p>

<section id="login" class="card">
<h2>অ্যাডমিন লগইন</h2>
<label>ইমেইল</label>
<input id="email" type="email" autocomplete="username">
<label>পাসওয়ার্ড</label>
<input id="password" type="password" autocomplete="current-password">
<button id="signIn" type="button">লগইন করুন</button>
</section>

<section id="panel" class="card hidden">
<button id="signOut" class="secondary" type="button">লগআউট</button>
<h2 id="formTitle">➕ নতুন পণ্য যোগ করুন</h2>

<form id="form">
<label>পণ্যের নাম *</label>
<input id="name" required maxlength="180">

<label>বিক্রয় মূল্য (টাকা) *</label>
<input id="price" type="number" min="0" required>

<label>আগের মূল্য (টাকা)</label>
<input id="oldPrice" type="number" min="0">

<label>ছবি আপলোড করুন</label>
<input id="photoFile" type="file" accept="image/*">
<img id="preview" class="hidden" style="max-width:180px;max-height:180px;object-fit:contain;margin-top:10px" alt="ছবির প্রিভিউ">

<p class="hint">অথবা ছবির সরাসরি URL দিন।</p>
<label>ছবির URL</label>
<input id="image" type="url" placeholder="https://...">

<label>পণ্যের বিবরণ</label>
<textarea id="desc" rows="3" maxlength="1000"></textarea>

<button id="save" type="submit">পণ্য সংরক্ষণ করুন</button>
<button id="cancelEdit" class="secondary hidden" type="button">এডিট বাতিল</button>
</form>

<h2>📦 সংরক্ষিত পণ্য</h2>
<div id="list">পণ্য লোড হচ্ছে…</div>
</section>

<p class="hint">ছোট আকারের পণ্যের ছবি ব্যবহার করুন।</p>
</main>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,
 signOut,setPersistence,inMemoryPersistence
}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{
 getFirestore,collection,addDoc,getDocs,deleteDoc,
 updateDoc,doc,serverTimestamp
}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const config={
 apiKey:'AIzaSyA51VwuUTSCZAscEWhyyzhBJw4tntqHsMQ',
 authDomain:'fixed-price-bd.firebaseapp.com',
 projectId:'fixed-price-bd',
 storageBucket:'fixed-price-bd.firebasestorage.app',
 messagingSenderId:'1055121018003',
 appId:'1:1055121018003:web:f1bcebcb16376fa8bb9166',
 measurementId:'G-BWZF99N2TV'
};

const app=initializeApp(config);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let selectedImage='';
let editingId='';

function say(t){$('status').textContent=t}
function fail(t,e){say(t+': '+(e.code||'')+' — '+e.message)}

await setPersistence(auth,inMemoryPersistence);

onAuthStateChanged(auth,u=>{
 $('login').classList.toggle('hidden',!!u);
 $('panel').classList.toggle('hidden',!u);
 if(u){
  say('লগইন করা আছে: '+u.email);
  load();
 }else{
  $('list').textContent='লগইন করলে পণ্য দেখা যাবে।';
 }
});

$('signIn').onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,$('email').value.trim(),$('password').value
  );
 }catch(e){fail('লগইন ব্যর্থ',e)}
};

$('signOut').onclick=async()=>{
 resetForm();
 try{await signOut(auth)}
 catch(e){fail('লগআউট ব্যর্থ',e)}
};

$('photoFile').onchange=async()=>{
 selectedImage='';
 $('preview').classList.add('hidden');
 const file=$('photoFile').files[0];
 if(!file)return;

 if(!file.type.startsWith('image/')){
  say('ছবির ফাইল নির্বাচন করুন।');
  return;
 }

 try{
  selectedImage=await compress(file);
  $('preview').src=selectedImage;
  $('preview').classList.remove('hidden');
  $('image').value='';
  say('ছবি প্রস্তুত। এখন পণ্য সংরক্ষণ করুন।');
 }catch(e){
  say('ছবি প্রস্তুত করা যায়নি: '+e.message);
 }
};

function compress(file){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  const url=URL.createObjectURL(file);

  img.onload=()=>{
   URL.revokeObjectURL(url);
   const scale=Math.min(1,650/Math.max(img.width,img.height));
   const c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(img.width*scale));
   c.height=Math.max(1,Math.round(img.height*scale));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);

   const data=c.toDataURL('image/jpeg',.5);
   if(data.length>650000){
    reject(new Error('ছবিটি আরও ছোট করে বেছে নিন।'));
   }else{
    resolve(data);
   }
  };

  img.onerror=()=>{
   URL.revokeObjectURL(url);
   reject(new Error('ছবি খোলা যায়নি'));
  };
  img.src=url;
 });
}

function resetForm(){
 editingId='';
 selectedImage='';
 $('form').reset();
 $('preview').classList.add('hidden');
 $('save').textContent='পণ্য সংরক্ষণ করুন';
 $('formTitle').textContent='➕ নতুন পণ্য যোগ করুন';
 $('cancelEdit').classList.add('hidden');
}

$('cancelEdit').onclick=resetForm;

$('form').onsubmit=async e=>{
 e.preventDefault();

 if(!auth.currentUser){
  say('আগে অ্যাডমিন লগইন করুন।');
  return;
 }

 const image=selectedImage||$('image').value.trim();
 const name=$('name').value.trim();
 const price=Number($('price').value);
 const oldPrice=Number($('oldPrice').value||0);
 const desc=$('desc').value.trim();

 if(!name||!Number.isFinite(price)||price<0){
  say('পণ্যের নাম ও সঠিক দাম লিখুন।');
  return;
 }

 if(image.startsWith('data:image/')&&image.length>700000){
  say('ছবিটি বড়। ছোট ছবি ব্যবহার করুন।');
  return;
 }

 $('save').disabled=true;

 try{
  if(editingId){
   await updateDoc(doc(db,'products',editingId),{
    name,price,oldPrice,image,desc,
    updatedAt:serverTimestamp()
   });
   say('পণ্যের তথ্য আপডেট হয়েছে।');
  }else{
   await addDoc(collection(db,'products'),{
    name,price,oldPrice,image,desc,
    createdAt:serverTimestamp()
   });
   say('নতুন পণ্য সংরক্ষণ হয়েছে।');
  }

  resetForm();
  await load();

 }catch(err){
  fail('সংরক্ষণ ব্যর্থ। Firestore Rules পরীক্ষা করুন',err);
 }finally{
  $('save').disabled=false;
 }
};

async function load(){
 try{
  const s=await getDocs(collection(db,'products'));
  $('list').replaceChildren();

  if(s.empty){
   $('list').textContent='এখনও কোনো পণ্য নেই।';
   return;
  }

  s.forEach(d=>{
   const p=d.data();
   const div=document.createElement('div');
   div.className='item';

   const b=document.createElement('b');
   b.textContent=p.name||'(নাম নেই)';

   const line=document.createElement('div');
   line.textContent='বিক্রয় মূল্য: ৳'+(p.price||0)+
    ' | আগের মূল্য: ৳'+(p.oldPrice??p.old??0);

   div.append(b,line);

   if(p.desc||p.description){
    const desc=document.createElement('p');
    desc.textContent=p.desc||p.description;
    div.append(desc);
   }

   if(p.image){
    const im=document.createElement('img');
    im.src=p.image;
    im.alt=p.name||'পণ্যের ছবি';
    div.append(im);
   }

   const actions=document.createElement('div');
   actions.className='item-actions';

   const edit=document.createElement('button');
   edit.textContent='✏️ এডিট করুন';

   edit.onclick=()=>{
    editingId=d.id;
    $('name').value=p.name||'';
    $('price').value=p.price??0;
    $('oldPrice').value=p.oldPrice??p.old??p.regularPrice??0;
    $('desc').value=p.desc||p.description||'';

    selectedImage=String(p.image||'').startsWith('data:image/')
     ?p.image:'';

    $('image').value=selectedImage?'':(p.image||'');

    if(selectedImage){
     $('preview').src=selectedImage;
     $('preview').classList.remove('hidden');
    }else{
     $('preview').classList.add('hidden');
    }

    $('formTitle').textContent='✏️ পণ্য এডিট করুন';
    $('save').textContent='পরিবর্তন সংরক্ষণ করুন';
    $('cancelEdit').classList.remove('hidden');
    $('form').scrollIntoView({behavior:'smooth',block:'start'});
    say('এডিট করছেন: '+(p.name||''));
   };

   const del=document.createElement('button');
   del.className='danger';
   del.textContent='🗑️ মুছুন';

   del.onclick=async()=>{
    if(!confirm('এই পণ্যটি স্থায়ীভাবে মুছবেন?'))return;

    try{
     await deleteDoc(doc(db,'products',d.id));
     if(editingId===d.id)resetForm();
     say('পণ্য মুছে ফেলা হয়েছে।');
     await load();
    }catch(err){
     fail('পণ্য মুছতে সমস্যা',err);
    }
   };

   actions.append(edit,del);
   div.append(actions);
   $('list').append(div);
  });

 }catch(e){
  fail('পণ্য লোড ব্যর্থ। Firestore Rules পরীক্ষা করুন',e);
 }
}
</script>
</body>
</html>
